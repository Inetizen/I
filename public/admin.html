<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Robot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #e9ecef; margin: 0; }
        
        /* Login Screen Styles */
        #login-screen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #343a40; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 300px; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        .login-box button { background: #007bff; color: white; width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #login-error { color: red; margin-top: 10px; display: none; }

        /* Main Dashboard Styles (Hidden initially) */
        #main-dashboard { display: none; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .btn-logout { background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .left-panel { flex: 1; min-width: 300px; max-width: 400px; }
        .robot-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #007bff; display: flex; justify-content: space-between; }
        .right-panel { flex: 2; min-width: 400px; max-width: 800px; background: white; padding: 20px; border-radius: 8px; text-align: center; }
        #captured-image { width: 100%; max-height: 60vh; object-fit: contain; display: none; border: 4px solid #343a40; background: #000; border-radius: 8px;}
        .verdict-btns { display: flex; gap: 20px; margin-top: 20px; justify-content: center; }
        .verdict-btns button { padding: 15px 40px; border: none; font-size: 20px; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-pass { background: #28a745; }
        .btn-fail { background: #dc3545; }
        #status-msg { color: #6c757d; font-size: 18px; margin: 20px 0; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button id="login-btn">Login</button>
            <div id="login-error">Invalid email or password.</div>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="main-dashboard">
        <div class="header-top">
            <h1>🤖 Robot Control Panel</h1>
            <button class="btn-logout" id="logout-btn">Logout</button>
        </div>
        
        <div class="container">
            <div class="left-panel">
                <h2>Connected Robots</h2>
                <div id="robot-list">Waiting for robots...</div>
            </div>

            <div class="right-panel">
                <h2 style="margin-top: 0;">Live Auto-Capture Viewer</h2>
                <p id="status-msg">Waiting for robots to auto-capture...</p>
                <img id="captured-image" src="" alt="Captured from robot">
                
                <div id="verdict-controls" style="display: none;" class="verdict-btns">
                    <button class="btn-pass" onclick="sendVerdict('PASS')">✅ PASS Screen</button>
                    <button class="btn-fail" onclick="sendVerdict('FAILED')">❌ FAILED Screen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE AUTHENTICATION SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 👇👇 YAHAN APNA FIREBASE CONFIG PASTE KAREN 👇👇
        const firebaseConfig = {
            apiKey: "AIzaSyYourApiKeyHere...",
            authDomain: "robot-22121.firebaseapp.com",
            projectId: "robot-22121",
            storageBucket: "robot-22121.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        // 👆👆 YAHAN APNA FIREBASE CONFIG PASTE KAREN 👆👆

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginScreen = document.getElementById('login-screen');
        const mainDashboard = document.getElementById('main-dashboard');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('login-error');

        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                mainDashboard.style.display = 'block';
            } else {
                loginScreen.style.display = 'flex';
                mainDashboard.style.display = 'none';
            }
        });

        // Login Action
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, password)
                .catch((error) => {
                    errorMsg.style.display = 'block';
                    console.error("Login Failed:", error.message);
                });
        });

        // Logout Action
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });
    </script>

    <!-- ROBOT CONTROL SCRIPTS (Socket.io) -->
    <script>
        const socket = io();
        let currentViewingRobot = null;

        socket.on('update-robot-list', (robots) => {
            const listDiv = document.getElementById('robot-list');
            listDiv.innerHTML = '';
            if (Object.keys(robots).length === 0) {
                listDiv.innerHTML = '<p style="color:red;">No robots connected.</p>';
                return;
            }
            for (const id in robots) {
                listDiv.innerHTML += `
                    <div class="robot-card">
                        <div><strong>Robot:</strong> <span style="font-size:12px;">${id}</span></div>
                    </div>
                `;
            }
        });

        // Receive Auto-Captured Picture
        socket.on('receive-picture', (data) => {
            currentViewingRobot = data.robotId;
            document.getElementById('status-msg').style.display = 'none';
            
            const img = document.getElementById('captured-image');
            img.src = data.imageStr;
            img.style.display = 'block';
            
            // Show Pass/Fail buttons so you can still send signals to the robot screen
            document.getElementById('verdict-controls').style.display = 'flex';
        });

        function sendVerdict(verdict) {
            if (currentViewingRobot) {
                socket.emit('send-verdict', { robotId: currentViewingRobot, verdict: verdict });
                document.getElementById('verdict-controls').style.display = 'none';
                document.getElementById('status-msg').innerText = `✅ Sent "${verdict}" to robot! Waiting for next auto-capture...`;
                document.getElementById('status-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
