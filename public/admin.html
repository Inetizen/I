<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Robot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #e9ecef; margin: 0; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        
        /* Left Side: Robot List */
        .left-panel { flex: 1; min-width: 300px; max-width: 400px; }
        .robot-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #007bff; }
        
        /* Right Side: Image Viewer */
        .right-panel { flex: 2; min-width: 400px; max-width: 800px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; align-items: center; }
        
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: scale(0.98); }
        .btn-trigger { background: #007bff; color: white; }
        
        /* Big Verdict Buttons */
        .verdict-btns { display: flex; gap: 20px; margin-top: 20px; width: 100%; justify-content: center; }
        .btn-pass { background: #28a745; color: white; font-size: 20px; padding: 15px 40px; flex: 1; max-width: 250px; }
        .btn-fail { background: #dc3545; color: white; font-size: 20px; padding: 15px 40px; flex: 1; max-width: 250px; }
        
        #captured-image { width: 100%; max-height: 60vh; object-fit: contain; display: none; margin-top: 15px; border: 4px solid #343a40; border-radius: 8px; background: #000; }
        #status-msg { color: #6c757d; font-size: 18px; margin-top: 50px; margin-bottom: 50px; }
    </style>
</head>
<body>

    <h1>🤖 Robot Control Panel</h1>
    
    <div class="container">
        <!-- Left Side: List of Robots -->
        <div class="left-panel">
            <h2 style="color: #333; border-bottom: 2px solid #ccc; padding-bottom: 10px;">Connected Robots</h2>
            <div id="robot-list">Waiting for robots to connect...</div>
        </div>

        <!-- Right Side: Picture Viewer & Verdict -->
        <div class="right-panel">
            <h2 style="color: #333; margin-top: 0;">Live Camera Viewer</h2>
            
            <!-- Default message before clicking the button -->
            <p id="status-msg">👈 Click "Force Picture" on a robot to view the image here.</p>
            
            <!-- This is where the big picture will show up -->
            <img id="captured-image" src="" alt="Captured from robot">
            
            <!-- Pass / Fail Buttons (Hidden until picture arrives) -->
            <div id="verdict-controls" style="display: none;" class="verdict-btns">
                <button class="btn-pass" onclick="sendVerdict('PASS')">✅ PASS</button>
                <button class="btn-fail" onclick="sendVerdict('FAILED')">❌ FAILED</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentViewingRobot = null;

        // 1. Update the list of connected robots
        socket.on('update-robot-list', (robots) => {
            const listDiv = document.getElementById('robot-list');
            listDiv.innerHTML = '';
            
            if (Object.keys(robots).length === 0) {
                listDiv.innerHTML = '<p style="color:red;">No robots connected.</p>';
                return;
            }

            for (const id in robots) {
                listDiv.innerHTML += `
                    <div class="robot-card">
                        <div>
                            <strong>Robot ID:</strong><br> 
                            <span style="font-size: 12px; color: #666;">${id}</span>
                        </div>
                        <button class="btn-trigger" onclick="triggerPic('${id}')">📸 Force Picture</button>
                    </div>
                `;
            }
        });

        // 2. Admin requests picture from robot
        function triggerPic(robotId) {
            // Update UI to show loading state
            document.getElementById('status-msg').innerText = "📸 Capturing picture... Please wait.";
            document.getElementById('status-msg').style.display = 'block';
            document.getElementById('captured-image').style.display = 'none';
            document.getElementById('verdict-controls').style.display = 'none';
            
            // Send trigger to server
            socket.emit('admin-trigger-pic', robotId);
        }

        // 3. Admin receives picture from robot
        socket.on('receive-picture', (data) => {
            currentViewingRobot = data.robotId;
            
            // Hide the status text
            document.getElementById('status-msg').style.display = 'none';
            
            // Show the large picture
            const img = document.getElementById('captured-image');
            img.src = data.imageStr;
            img.style.display = 'block';
            
            // Show the PASS / FAILED buttons
            document.getElementById('verdict-controls').style.display = 'flex';
        });

        // 4. Send Pass/Fail back to robot
        function sendVerdict(verdict) {
            if (currentViewingRobot) {
                socket.emit('send-verdict', { robotId: currentViewingRobot, verdict: verdict });
                
                // Hide buttons and image, reset screen for the next robot
                document.getElementById('verdict-controls').style.display = 'none';
                document.getElementById('captured-image').style.display = 'none';
                
                const statusMsg = document.getElementById('status-msg');
                statusMsg.innerText = `✅ Result "${verdict}" sent! Waiting for next capture...`;
                statusMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
