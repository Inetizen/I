<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Worker UI</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: white; font-family: Arial, sans-serif; }
        #camera-feed { display: none; }
        #ui-container { text-align: center; }
        #verdict-text { font-size: 15vw; font-weight: bold; display: none; text-transform: uppercase; }
        .pass { color: green; }
        .failed { color: red; }
    </style>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="photo-canvas" style="display:none;"></canvas>

    <div id="ui-container">
        <img id="qr-code" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=RobotWorker" alt="Robot QR">
        <div id="verdict-text"></div>
    </div>

    <script>
        const socket = io();
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('photo-canvas');
        
        async function initializeCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { ideal: 1280 }, audio: false });
                video.srcObject = stream;
                socket.emit('register-robot'); 
                
                // 🚀 UPDATE: कैमरा लोड होने के लिए 500ms (आधा सेकंड) का इंतज़ार
                setTimeout(() => {
                    // 1. ओपन होते ही तुरंत पहली फोटो क्लिक और सेव
                    takeAndSendPicture(); 
                    console.log("First picture clicked immediately!");

                    // 2. इसके बाद हर 3 सेकंड (3000ms) में अपने आप फोटो क्लिक होती रहेगी
                    setInterval(takeAndSendPicture, 3000); 
                }, 500);

            } catch (error) {
                console.error("Camera Error:", error);
            }
        }

        function takeAndSendPicture() {
            if(video.videoWidth === 0) return; // Make sure camera is ready
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const imageData = canvas.toDataURL('image/jpeg', 0.6); // Compress to 60% quality for faster uploads
            
            // Send to server as auto-picture
            socket.emit('auto-picture-taken', { image: imageData });
            console.log("Auto picture clicked and sent.");
        }

        // Listen for manual admin trigger (just in case)
        socket.on('take-picture', takeAndSendPicture);

        // Listen for PASS/FAIL
        socket.on('show-verdict', (verdict) => {
            const verdictText = document.getElementById('verdict-text');
            const qrCode = document.getElementById('qr-code');
            
            qrCode.style.display = 'none';
            verdictText.style.display = 'block';
            verdictText.innerText = verdict;
            verdictText.className = (verdict === 'PASS') ? 'pass' : 'failed';
            
            setTimeout(() => {
                verdictText.style.display = 'none';
                qrCode.style.display = 'inline';
            }, 5000);
        });

        initializeCamera();
    </script>
</body>
</html>
