<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Full History</title>
    <style>
        body { font-family: Arial; background: #e9ecef; padding: 20px; text-align: center; margin: 0; }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Grid Layout for History */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* Individual Card Design */
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; text-align: left; position: relative; }
        .card img { width: 100%; height: auto; border-radius: 8px; border: 2px solid #ddd; margin-bottom: 15px; }
        
        .info-row { font-size: 14px; color: #555; margin-bottom: 8px; }
        .info-row strong { color: #222; }
        
        .badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; text-align: center; margin-bottom: 10px; width: fit-content; }
        .badge.pending { background: #ff9800; }
        .badge.pass { background: #28a745; }
        .badge.fail { background: #dc3545; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-group button { flex: 1; padding: 10px; font-size: 16px; border: none; cursor: pointer; border-radius: 5px; color: white; font-weight: bold; transition: 0.2s;}
        .btn-pass { background: #28a745; }
        .btn-pass:hover { background: #218838; }
        .btn-fail { background: #dc3545; }
        .btn-fail:hover { background: #c82333; }
        
        /* Delete Button Styles */
        .btn-delete { background: #6c757d; margin-top: 10px; width: 100%; padding: 10px; font-size: 14px; border: none; cursor: pointer; border-radius: 5px; color: white; font-weight: bold; transition: 0.2s; }
        .btn-delete:hover { background: #5a6268; }

        .map-link { color: #007bff; text-decoration: none; font-weight: bold; }
        .map-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>👨‍💻 Admin Panel - Robot Logs & History</h2>
    
    <!-- Yahan saari photos automatically add hongi -->
    <div class="grid-container" id="log-container">
        <p>Loading records...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // ✅ ADDED deleteDoc import here
        import { getFirestore, collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ✅ AAPKA FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBL8Dugodx4v0ZOUnlRwPfztxU4fsrFISc",
            authDomain: "robot-22121.firebaseapp.com",
            projectId: "robot-22121",
            storageBucket: "robot-22121.firebasestorage.app",
            messagingSenderId: "1097502963537",
            appId: "1:1097502963537:web:9355ca7bdb29ae453d0570"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Firebase se SAARA data laana (Naya sabse upar = desc)
        const q = query(collection(db, "robot_logs"), orderBy("timestamp", "desc"));
        
        onSnapshot(q, (snapshot) => {
            const container = document.getElementById('log-container');
            container.innerHTML = ''; // Purana clear karo
            
            if (snapshot.empty) {
                container.innerHTML = '<h3>No records found yet.</h3>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                // Date & Time formatting
                let dateTimeStr = 'Syncing time...';
                if (data.timestamp) {
                    const dateObj = data.timestamp.toDate();
                    dateTimeStr = dateObj.toLocaleDateString() + " " + dateObj.toLocaleTimeString();
                }

                // GPS Link for Google Maps
                let gpsInfo = `Unknown`;
                if (data.lat && data.lat !== "Unknown") {
                    gpsInfo = `<a href="https://www.google.com/maps?q=${data.lat},${data.lng}" target="_blank" class="map-link">📍 ${data.lat}, ${data.lng}</a>`;
                }

                // Badge styling
                let badgeClass = data.status === "PASS" ? "pass" : (data.status === "FAIL" ? "fail" : "pending");
                
                // Buttons dikhana hai ya nahi (Sirf PENDING me dikhenge)
                let buttonsHtml = '';
                if (data.status === "PENDING") {
                    buttonsHtml = `
                        <div class="btn-group">
                            <button class="btn-pass" onclick="sendVerdict('${docId}', 'PASS')">✅ PASS</button>
                            <button class="btn-fail" onclick="sendVerdict('${docId}', 'FAIL')">❌ FAIL</button>
                        </div>
                    `;
                }

                // Card ka HTML generate karna (Added Delete button at the bottom)
                const cardHtml = `
                    <div class="card">
                        <div class="badge ${badgeClass}">${data.status}</div>
                        <img src="${data.imageText}" alt="Robot Capture">
                        <div class="info-row"><strong>📅 Date & Time:</strong> ${dateTimeStr}</div>
                        <div class="info-row"><strong>🌍 GPS:</strong> ${gpsInfo}</div>
                        ${buttonsHtml}
                        <button class="btn-delete" onclick="deleteRecord('${docId}')">🗑️ Delete</button>
                    </div>
                `;
                
                container.innerHTML += cardHtml;
            });
        });

        // 2. Button dabane par kisi specific photo ka status update karna
        window.sendVerdict = async function(docId, verdict) {
            try {
                await updateDoc(doc(db, "robot_logs", docId), {
                    status: verdict
                });
            } catch (error) {
                console.error("Error updating verdict:", error);
                alert("Update failed. Check console.");
            }
        };

        // 3. Delete functionality
        window.deleteRecord = async function(docId) {
            // Ask for confirmation before deleting
            const confirmDelete = confirm("Are you sure you want to permanently delete this image?");
            
            if (confirmDelete) {
                try {
                    await deleteDoc(doc(db, "robot_logs", docId));
                } catch (error) {
                    console.error("Error deleting record:", error);
                    alert("Delete failed. Check console.");
                }
            }
        };
    </script>
</body>
</html>
