<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Robot Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.4.0/exif-js.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #e9ecef; margin: 0; }
        /* Login Screen Styles */
        #login-screen { position: fixed; top:0; left:0; width: 100%; height: 100%; background: #343a40; display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column; }
        .login-box { background: white; padding: 40px; border-radius: 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 300px; }
        .login-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .login-box button { background: #007bff; color: white; width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .login-box button:hover { background: #0056b3; }
        #login-error { color: red; margin-top: 15px; display: none; font-size: 14px; font-weight: bold; }
        /* Main Dashboard Styles (Hidden initially) */
        #main-dashboard { display: none; }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-logout { background: #dc3545; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .left-panel { flex: 1; min-width: 300px; max-width: 400px; }
        .robot-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #007bff; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .right-panel { flex: 2; min-width: 400px; max-width: 800px; background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #captured-image { width: 100%; max-height: 60vh; object-fit: contain; display: none; border: 4px solid #343a40; background: #000; border-radius: 8px; margin-top: 15px;}
        .verdict-btns { display: flex; gap: 20px; margin-top: 20px; justify-content: center; }
        .verdict-btns button { padding: 15px 40px; border: none; font-size: 20px; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; flex: 1; }
        .btn-pass { background: #28a745; }
        .btn-fail { background: #dc3545; }
        #status-msg { color: #6c757d; font-size: 18px; margin: 20px 0; }
    </style>
</head>
<body>
    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-top:0;">Admin Login</h2>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="password" id="password" placeholder="Password" required>
            <button id="login-btn">Login to Dashboard</button>
            <div id="login-error">Invalid email or password.</div>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="main-dashboard">
        <div class="header-top">
            <h1 style="margin: 0;">🤖 Robot Control Panel</h1>
            <button class="btn-logout" id="logout-btn">Logout</button>
        </div>
        <div class="container">
            <div class="left-panel">
                <h2 style="border-bottom: 2px solid #ccc; padding-bottom: 10px;">Connected Robots</h2>
                <div id="robot-list">Waiting for robots...</div>
            </div>
            <div class="right-panel">
                <h2 style="margin-top: 0;">Live Auto-Capture Viewer</h2>
                <p id="status-msg">Waiting for robots to auto-capture (every 10s)...</p>
                <img id="captured-image" src="" alt="Captured from robot">
                <div id="verdict-controls" style="display: none;" class="verdict-btns">
                    <!-- HTML buttons call the global function exposed in JS -->
                    <button class="btn-pass" onclick="window.sendVerdict('PASS')">✅ Send PASS</button>
                    <button class="btn-fail" onclick="window.sendVerdict('FAILED')">❌ Send FAILED</button>
                </div>
            </div>
        </div>
    </div>

    <!-- COMBINED FIREBASE & SOCKET.IO SCRIPTS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        // ✅ NEW: Import Firestore Database functions
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBL8Dugodx4v0ZOUnlRwPfztxU4fsrFISc",
            authDomain: "robot-22121.firebaseapp.com",
            projectId: "robot-22121",
            storageBucket: "robot-22121.firebasestorage.app",
            messagingSenderId: "1097502963537",
            appId: "1:1097502963537:web:9355ca7bdb29ae453d0570",
            measurementId: "G-PKKD1DD7LZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // ✅ Initialize Database

        // --- UI Elements ---
        const loginScreen = document.getElementById('login-screen');
        const mainDashboard = document.getElementById('main-dashboard');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('login-error');

        // --- AUTHENTICATION LOGIC ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                mainDashboard.style.display = 'block';
                errorMsg.style.display = 'none';
            } else {
                loginScreen.style.display = 'flex';
                mainDashboard.style.display = 'none';
            }
        });

        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return;
            signInWithEmailAndPassword(auth, email, password).catch(error => {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            });
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        // --- SOCKET.IO & ROBOT LOGIC ---
        const socket = io();
        let currentViewingRobot = null;
        let currentImageStr = null; // Store image temporarily to save in DB

        socket.on('update-robot-list', (robots) => {
            const listDiv = document.getElementById('robot-list');
            listDiv.innerHTML = '';
            if (Object.keys(robots).length === 0) {
                listDiv.innerHTML = '<p style="color:red; font-weight:bold;">No robots connected.</p>';
                return;
            }
            for (const id in robots) {
                listDiv.innerHTML += `
                    <div class="robot-card">
                        <div><strong>Robot Active:</strong> <br> <span style="font-size:12px; color:gray;">${id}</span></div>
                    </div>`;
            }
        });

        socket.on('receive-picture', (data) => {
            currentViewingRobot = data.robotId;
            currentImageStr = data.imageStr; // Save base64 image
            
            document.getElementById('status-msg').style.display = 'none';
            const img = document.getElementById('captured-image');
            img.src = data.imageStr;
            img.style.display = 'block';
            document.getElementById('verdict-controls').style.display = 'flex';
        });

        // ✅ NEW: Function to send verdict AND save to Firebase
        // Exposed to `window` so HTML onclick buttons can reach it
        window.sendVerdict = async function(verdict) {
            if (currentViewingRobot) {
                // 1. Emit verdict to socket
                socket.emit('send-verdict', { robotId: currentViewingRobot, verdict: verdict });

                const statusMsg = document.getElementById('status-msg');
                statusMsg.innerText = "Saving to database...";
                statusMsg.style.display = 'block';
                document.getElementById('verdict-controls').style.display = 'none';

                // 2. Save data to Firebase Firestore
                try {
                    await addDoc(collection(db, "robot_logs"), {
                        robotId: currentViewingRobot,
                        verdict: verdict,
                        image: currentImageStr, // Save the image string
                        timestamp: serverTimestamp() // Add exact time
                    });
                    
                    statusMsg.innerText = `✅ Sent "${verdict}" & Saved to Database! Waiting for next...`;
                } catch (error) {
                    console.error("Error saving to Firebase: ", error);
                    statusMsg.innerText = `⚠️ Sent "${verdict}" but failed to save to Database.`;
                }
            }
        };
    </script>
</body>
</html>
