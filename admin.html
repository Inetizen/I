<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <style>
        body { text-align: center; font-family: Arial; background: #e9ecef; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        img { max-width: 100%; border: 4px solid #333; border-radius: 8px; display: none; margin-top: 15px; }
        .controls { display: none; margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; border: none; cursor: pointer; border-radius: 5px; color: white; font-weight: bold; margin: 0 10px; }
        .btn-pass { background: #28a745; }
        .btn-fail { background: #dc3545; }
        #status { font-size: 18px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <div class="box">
        <h2>👨‍💻 Admin Control Panel</h2>
        <p id="status">Waiting for new PENDING photos from Robot...</p>
        
        <img id="display-image" src="" alt="Captured Photo">
        
        <div class="controls" id="controls">
            <button class="btn-pass" onclick="sendVerdict('PASS')">✅ PASS</button>
            <button class="btn-fail" onclick="sendVerdict('FAIL')">❌ FAIL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ✅ AAPKA FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBL8Dugodx4v0ZOUnlRwPfztxU4fsrFISc",
            authDomain: "robot-22121.firebaseapp.com",
            projectId: "robot-22121",
            storageBucket: "robot-22121.firebasestorage.app",
            messagingSenderId: "1097502963537",
            appId: "1:1097502963537:web:9355ca7bdb29ae453d0570"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentDocId = null;

        // 1. Firebase me Real-time PENDING photos check karna
        const q = query(collection(db, "robot_logs"), where("status", "==", "PENDING"));
        
        onSnapshot(q, (snapshot) => {
            if (!snapshot.empty) {
                // Jo sabse pehli PENDING photo mili, use uthao
                const firstDoc = snapshot.docs[0];
                currentDocId = firstDoc.id;
                const data = firstDoc.data();

                // Image screen par dikhao
                document.getElementById('display-image').src = data.imageText;
                document.getElementById('display-image').style.display = "block";
                document.getElementById('controls').style.display = "block";
                document.getElementById('status').innerText = "New photo received! Please give verdict.";
            } else {
                // Agar koi PENDING photo nahi hai
                currentDocId = null;
                document.getElementById('display-image').style.display = "none";
                document.getElementById('controls').style.display = "none";
                document.getElementById('status').innerText = "Waiting for new PENDING photos from Robot...";
            }
        });

        // 2. Verdict dabane par Database me status update karna
        window.sendVerdict = async function(verdict) {
            if (!currentDocId) return;

            document.getElementById('status').innerText = "Updating Database...";
            document.getElementById('controls').style.display = "none"; // Hide buttons immediately to prevent double click

            try {
                // PENDING se hatakar PASS ya FAIL kar do
                await updateDoc(doc(db, "robot_logs", currentDocId), {
                    status: verdict
                });
                // Firebase apne aap onSnapshot trigger karega aur screen clear kar dega
            } catch (error) {
                console.error("Error updating verdict:", error);
                alert("Database update failed. Check console.");
            }
        };
    </script>
</body>
</html>
