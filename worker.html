<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Worker (Auto Capture)</title>
    <style>
        body { text-align: center; font-family: Arial; background: #222; color: white; margin-top: 50px; }
        video { border: 3px solid #00ffcc; border-radius: 10px; width: 300px; }
        #log { margin-top: 20px; font-size: 14px; color: #00ffcc; }
    </style>
</head>
<body>
    <h2>🤖 Robot Camera (Live Auto-Capture)</h2>
    <p>Camera is on. Sending photos to Admin automatically...</p>
    
    <!-- Video dikhega, Canvas hidden rahega photo click karne ke liye -->
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="log">Waiting for camera...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ✅ AAPKA FIREBASE CONFIGURATION (Example wala nahi)
        const firebaseConfig = {
            apiKey: "AIzaSyBL8Dugodx4v0ZOUnlRwPfztxU4fsrFISc",
            authDomain: "robot-22121.firebaseapp.com",
            projectId: "robot-22121",
            storageBucket: "robot-22121.firebasestorage.app",
            messagingSenderId: "1097502963537",
            appId: "1:1097502963537:web:9355ca7bdb29ae453d0570"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const log = document.getElementById('log');

        // 1. Camera On Karna
        navigator.mediaDevices.getUserMedia({ video: { ideal: 720 }, audio: false })
            .then(stream => { 
                video.srcObject = stream; 
                log.innerText = "Camera Started! Auto-capture active.";
                
                // 2. Har 5 second me photo click aur upload
                setInterval(takeAndUploadPicture, 5000); 
            })
            .catch(err => { 
                log.innerText = "❌ Camera Permission Denied!"; 
                console.error(err); 
            });

        // 3. Photo click karke Text (Base64) me convert aur Firebase me save karna
        async function takeAndUploadPicture() {
            if (video.videoWidth === 0) return; // Agar camera ready nahi hai toh ruk jao

            // Canvas par video frame draw karna
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // Image ko Base64 Text me convert karna (0.5 means 50% quality to save data)
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.5); 
            
            try {
                // Firebase Database me save karna (Status: PENDING)
                await addDoc(collection(db, "robot_logs"), {
                    imageText: imageBase64,
                    status: "PENDING",
                    timestamp: serverTimestamp()
                });
                
                let timeNow = new Date().toLocaleTimeString();
                log.innerText = `✅ Last photo sent to database at ${timeNow}`;
            } catch (error) {
                console.error("Error saving to Firebase: ", error);
                log.innerText = "⚠️ Failed to send photo. Check Firebase rules.";
            }
        }
    </script>
</body>
</html>
